version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn -w 1 --threads 2 -b 0.0.0.0:5000 --timeout 120 --access-logfile - --error-logfile - "app:create_app()"
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ./app/static/uploads:/app/app/static/uploads
      - ./instance/uploads:/app/instance/uploads
      - ./instance/backups:/app/instance/backups
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 150M
    mem_limit: 350m
    mem_reservation: 150m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB -c work_mem=4MB -c max_connections=30 -c maintenance_work_mem=16MB
    env_file: .env.production
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tma_admin} -d ${POSTGRES_DB:-tma_production}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 64M
    mem_limit: 200m
    mem_reservation: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata_prod:
