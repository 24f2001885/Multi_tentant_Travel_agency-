# =============================================================================
# Nginx Reverse Proxy Configuration for TMA Production
# Place in: /etc/nginx/sites-available/tma.conf
# Enable: ln -sf /etc/nginx/sites-available/tma.conf /etc/nginx/sites-enabled/
# Reload: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# 1. HTTP to HTTPS Redirection (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name tma.tenant0.abhishek4312.info tma.tenant1.abhishek4312.info platform.abhishek4312.info;

    # Let's Encrypt / Certbot ACME HTTP-01 challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server Block (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tma.tenant0.abhishek4312.info tma.tenant1.abhishek4312.info platform.abhishek4312.info;

    # SSL Certificate Paths (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/tma.tenant0.abhishek4312.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tma.tenant0.abhishek4312.info/privkey.pem;

    # TLS Protocols & High-Security Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum file upload size (photos, trek galleries, avatars)
    client_max_body_size 25M;

    # Static Assets: Served directly by Nginx (bypasses Python/Gunicorn)
    location /static/ {
        alias /home/ubuntu/mad1/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Proxy all dynamic requests to Flask / Gunicorn Container (Port 5001)
    location / {
        proxy_pass http://127.0.0.1:5001;

        # CRUCIAL: Passes the exact Host header (e.g. tma.tenant0.abhishek4312.info) for tenant resolution
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for monitoring stream telemetry)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for longer PDF generation / heavy report tasks
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
