<style>
  /* Forces the sidebar to span full height and stick to the left on Desktop */
  @media (min-width: 768px) {
    #staffSidebar {
      position: sticky !important;
      top: 0;
      height: 100vh;
      display: flex !important;
      flex-direction: column;
    }
  }
</style>

<!-- Mobile Topbar -->
<div class="d-md-none bg-dark text-white p-3 d-flex justify-content-between align-items-center shadow-sm w-100" style="position: sticky; top: 0; z-index: 1040;">
    <a href="{{ url_for('staff.dashboard') }}" class="text-white text-decoration-none fw-bold fs-5" style="font-family: 'Bitter', serif;">
        TMA <span class="badge bg-success ms-1">Staff</span>
    </a>
    <button class="btn btn-sm btn-outline-light d-flex align-items-center gap-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#staffSidebar" aria-controls="staffSidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-list" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/>
        </svg> Menu
    </button>
</div>

<!-- Sidebar / Offcanvas -->
<div class="offcanvas-md offcanvas-start bg-dark text-white shadow" tabindex="-1" id="staffSidebar" style="width: 260px;">
    
    <!-- Offcanvas Header for Mobile -->
    <div class="offcanvas-header d-md-none border-bottom border-secondary">
        <h5 class="offcanvas-title fw-bold" style="font-family: 'Bitter', serif;">TMA Staff</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#staffSidebar"></button>
    </div>
    
    <!-- Desktop Header -->
    <a href="{{ url_for('staff.dashboard') }}" class="d-none d-md-block p-4 text-white text-decoration-none border-bottom border-secondary">
        <h3 class="fw-bold mb-0" style="font-family: 'Bitter', serif;">TMA</h3>
        <span class="badge bg-success mt-1">Staff</span>
    </a>
    
    <!-- Navigation Links (Flex-grow ensures it takes up remaining space) -->
    <div class="offcanvas-body p-0 overflow-auto flex-grow-1">
        <ul class="nav nav-pills flex-column mb-auto p-3 gap-2">
            <li class="nav-item">
                <a href="{{ url_for('staff.dashboard') }}" class="nav-link {% if request.endpoint == 'staff.dashboard' %}active bg-success{% else %}text-white{% endif %}">
                    Dashboard
                </a>
            </li>
            <li>
                <a href="{{ url_for('staff.profile') }}" class="nav-link {% if request.endpoint == 'staff.profile' %}active bg-success{% else %}text-white{% endif %}">
                    Profile
                </a>
            </li>
            <li>
                <a href="{{ url_for('tickets.list_tickets') }}" class="nav-link {% if 'tickets' in request.endpoint %}active bg-success{% else %}text-white{% endif %}">
                    Tickets
                </a>
            </li>
        </ul>
    </div>
    
    <!-- User Profile & Log Out Footer -->
    <div class="p-3 border-top border-secondary mt-auto">
        <div class="d-flex align-items-center text-white mb-3">
            <div class="rounded-circle bg-secondary d-flex justify-content-center align-items-center me-3 text-dark fw-bold" style="width: 42px; height: 42px; font-size: 1.2rem;">
                {{ current_user.name[:1]|upper }}
            </div>
            <div>
                <strong class="d-block text-truncate" style="max-width: 150px;">{{ current_user.name }}</strong>
                <span class="text-muted small">Staff Member</span>
            </div>
        </div>
        <form method="POST" action="{{ url_for('auth.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <button type="submit" class="btn btn-outline-danger w-100 fw-bold">Log Out</button>
        </form>
    </div>
</div>
