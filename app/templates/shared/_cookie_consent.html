<!-- DEBUG: _cookie_consent.html shown=true -->
<div id="tma-cookie-banner" class="tma-cookie-toast p-3 bg-dark text-white shadow-lg border border-secondary" role="dialog" aria-label="Cookie notice" style="display: none;">
  <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3">
    <div class="small text-secondary">
      <i class="bi bi-shield-check text-success me-1"></i>
      We use essential cookies to ensure secure logins and authenticate sessions across our platform.
      Review our <a href="{{ url_for('public.privacy') }}" class="text-white text-decoration-underline" target="_blank">Privacy Policy</a> to learn more.
    </div>
    <div class="d-flex gap-2 flex-shrink-0">
      <button type="button" id="tma-cookie-accept" class="btn btn-sm btn-primary px-3">
        Got it
      </button>
    </div>
  </div>
</div>

<style>
  .tma-cookie-toast {
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    max-width: 480px;
    z-index: 1040;
    border-radius: 12px;
  }
  @media (max-width: 576px) {
    .tma-cookie-toast {
      bottom: 0;
      right: 0;
      left: 0;
      max-width: 100%;
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-bottom: none;
    }
  }
</style>

<script>
  (function () {
    var banner = document.getElementById('tma-cookie-banner');
    var acceptBtn = document.getElementById('tma-cookie-accept');
    if (!banner || !acceptBtn) return;

    if (document.cookie.indexOf('tma_cookie_ack=1') === -1) {
      banner.style.display = 'block';
    }

    acceptBtn.addEventListener('click', function () {
      var d = new Date();
      d.setTime(d.getTime() + (365 * 24 * 60 * 60 * 1000));
      document.cookie = 'tma_cookie_ack=1; expires=' + d.toUTCString() + '; path=/; SameSite=Lax';
      banner.style.display = 'none';
    });
  })();
</script>
