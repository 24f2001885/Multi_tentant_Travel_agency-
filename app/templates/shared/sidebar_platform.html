<!-- DEBUG: sidebar_platform.html active={{ request.endpoint }} -->
<aside class="platform-sidebar d-flex flex-column flex-shrink-0 p-3" style="width: 250px; min-height: 100vh; background-color: var(--platform-sidebar-bg, #0B1120); color: #F8FAFC;">
  <a href="{{ url_for('platform.dashboard') }}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none text-white">
    <span class="fs-4 fw-bold tracking-tight" style="color: var(--platform-accent, #7C3AED);">TMA</span>
    <span class="fs-5 ms-2 fw-semibold text-white">Platform</span>
  </a>
  <div class="small text-muted mb-3">Operator Console</div>
  <hr style="border-color: #334155;">

  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item mb-1">
      <a href="{{ url_for('platform.dashboard') }}" class="nav-link text-white {{ 'active' if request.endpoint == 'platform.dashboard' else '' }}" style="{{ 'background-color: var(--platform-accent, #7C3AED);' if request.endpoint == 'platform.dashboard' else '' }}">
        <i class="bi bi-speedometer2 me-2"></i>
        Dashboard
      </a>
    </li>
    <li class="nav-item mb-1">
      <a href="{{ url_for('platform.organizations_list') }}" class="nav-link text-white {{ 'active' if request.endpoint in ['platform.organizations_list', 'platform.organization_new', 'platform.organization_detail', 'platform.organization_audit_logs'] else '' }}" style="{{ 'background-color: var(--platform-accent, #7C3AED);' if request.endpoint in ['platform.organizations_list', 'platform.organization_new', 'platform.organization_detail', 'platform.organization_audit_logs'] else '' }}">
        <i class="bi bi-building me-2"></i>
        Organizations
      </a>
    </li>
    <li class="nav-item mb-1">
      <a href="{{ url_for('platform.monitoring') }}" class="nav-link text-white {{ 'active' if request.endpoint == 'platform.monitoring' else '' }}" style="{{ 'background-color: var(--platform-accent, #7C3AED);' if request.endpoint == 'platform.monitoring' else '' }}">
        <i class="bi bi-activity me-2"></i>
        Monitoring
      </a>
    </li>
    <li class="nav-item mb-1">
      <a href="{{ url_for('platform.backups') }}" class="nav-link text-white {{ 'active' if request.endpoint == 'platform.backups' else '' }}" style="{{ 'background-color: var(--platform-accent, #7C3AED);' if request.endpoint == 'platform.backups' else '' }}">
        <i class="bi bi-cloud-arrow-down me-2"></i>
        Backups
      </a>
    </li>
    <li class="nav-item mb-1">
      <a href="{{ url_for('platform.audit_logs') }}" class="nav-link text-white {{ 'active' if request.endpoint == 'platform.audit_logs' else '' }}" style="{{ 'background-color: var(--platform-accent, #7C3AED);' if request.endpoint == 'platform.audit_logs' else '' }}">
        <i class="bi bi-shield-check me-2"></i>
        Audit Trail
      </a>
    </li>
    <li class="nav-item mb-1">
      <a href="{{ url_for('platform.profile') }}" class="nav-link text-white {{ 'active' if request.endpoint == 'platform.profile' else '' }}" style="{{ 'background-color: var(--platform-accent, #7C3AED);' if request.endpoint == 'platform.profile' else '' }}">
        <i class="bi bi-person-gear me-2"></i>
        Profile &amp; Settings
      </a>
    </li>
  </ul>

  <hr style="border-color: #334155;">
  <div class="d-flex flex-column">
    <div class="d-flex align-items-center mb-3">
      <img src="{{ admin.avatar_url if admin else '/static/img/default_avatar.svg' }}" 
           alt="{{ admin.name if admin else 'Platform Operator' }}" 
           class="rounded-circle me-2 border border-secondary shadow-sm flex-shrink-0" 
           style="width: 36px; height: 36px; object-fit: cover;"
           onerror="this.src='/static/img/default_avatar.svg'">
      <div class="text-truncate">
        <small class="text-muted d-block" style="font-size:0.75rem;">Operator</small>
        <strong class="text-white small text-truncate d-block" style="max-width:140px;">{{ admin.name if admin else 'Platform Operator' }}</strong>
      </div>
    </div>
    <form action="{{ url_for('platform.logout') }}" method="POST" class="d-inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-sm btn-outline-danger w-100">
        <i class="bi bi-box-arrow-right me-1"></i> Sign Out
      </button>
    </form>
  </div>
</aside>
