<nav class="navbar navbar-expand-md navbar-light bg-white border-bottom shadow-sm fixed-top">
  <div class="container-fluid px-4">
    <!-- Brand -->
    <a class="navbar-brand fw-bold" href="{{ url_for('public.landing') }}" style="font-family: 'Bitter', serif; color: #111827;">
      TMA
    </a>

    <!-- Mobile Hamburger Toggle -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#publicNavCollapse" aria-controls="publicNavCollapse" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Nav Links & Authentication -->
    <div class="collapse navbar-collapse" id="publicNavCollapse">
      <ul class="navbar-nav me-auto">
        <!-- Future public links can go here -->
      </ul>
      
      <div class="ms-auto d-flex flex-column flex-md-row align-items-md-center gap-3 mt-3 mt-md-0 pb-3 pb-md-0">
        {% if current_user.is_authenticated %}
          {% set dashboard_url = {
            'admin': url_for('admin.dashboard'),
            'staff': url_for('staff.dashboard'),
            'trekker': url_for('trekker.dashboard'),
          }[current_user.role] %}
          
          <a href="{{ dashboard_url }}" class="d-flex align-items-center text-decoration-none text-dark fw-medium" title="Go to Dashboard">
            <span class="me-2">My Dashboard</span>
            <img class="avatar-circle shadow-sm flex-shrink-0" 
                 src="{{ current_user.avatar_url }}" 
                 alt="{{ current_user.name }}"
                 style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #E5E7EB;"
                 onerror="this.src='/static/img/default_avatar.svg'">
          </a>
        {% else %}
          <a href="{{ url_for('auth.login') }}" class="text-dark fw-medium text-decoration-none">Log In</a>
          <a href="{{ url_for('auth.register') }}" class="btn text-white shadow-sm px-4" style="background-color: #1F4FD8;">Sign Up</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
