
{% extends "shared/base.html" %}
{% block shell %}{% endblock %}

{% block content %}
<div class="tma-card" style="max-width: 560px; margin: 4rem auto;">
  <h2>Confirm Your Booking</h2>
  <p><strong>{{ trek.name }}</strong></p>
  <p>{{ trek.start_date }} – {{ trek.end_date }}</p>
  <p>Price: ₹{{ trek.price }}</p>

  <form method="POST" action="{{ url_for('trekker.book', trek_id=trek.id) }}">
    {{ form.csrf_token }}
    <button type="submit" class="btn tma-btn-primary w-100">Confirm & Pay</button>
  </form>
  <a href="{{ url_for('trekker.trek_detail', trek_id=trek.id) }}" class="btn tma-btn-ghost w-100 mt-2">
    Back
  </a>
</div>
{% endblock %}
