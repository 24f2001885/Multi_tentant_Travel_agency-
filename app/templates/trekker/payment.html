 
{% extends "shared/base.html" %}

{% block content %}
<div class="tma-payment-wrapper">
  <div class="card tma-payment-card">
    <div class="card-body text-center">
      <h1 class="h4 mb-3">Complete Your Payment</h1>
      <p class="text-muted">{{ booking.trek.name }} — &#8377;{{ "%.2f"|format(booking.trek.price) }}</p>
      <div id="razorpay-container"></div>
      <p class="tma-payment-trust">Secured by Razorpay</p>
    </div>
  </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  var options = {
    key: "{{ razorpay_key }}",
    amount: "{{ amount }}",
    currency: "INR",
    order_id: "{{ order_id }}",
    name: "Trekking Management Application",
    description: "{{ booking.trek.name }}",
    handler: function (response) {
      window.location.href = "{{ url_for('trekker.payment_result', booking_id=booking.id) }}";
    },
    modal: {
      ondismiss: function () {
        window.location.href = "{{ url_for('trekker.payment_result', booking_id=booking.id) }}";
      }
    },
    theme: { color: "#1F4FD8" }
  };
  var rzp = new Razorpay(options);
  rzp.open();
</script>

<style>
  .tma-payment-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F7F7F8; padding: 2rem; }
  .tma-payment-card { width: 400px; max-width: 100%; border: 1px solid #E2E4E9; border-radius: 10px; }
  .tma-payment-trust { color: #6B7280; font-size: 0.75rem; margin-top: 1rem; }
</style>
{% endblock %}
