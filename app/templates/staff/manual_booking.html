{% extends "shared/base.html" %}
{% block title %}Create Manual Booking — Staff{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <h2 class="h3 mb-0">Create Offline / Manual Booking</h2>
        <a href="{{ url_for('staff.dashboard') }}" class="btn btn-outline-secondary btn-sm">&larr; Back to Dashboard</a>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('staff.manual_booking_new') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
              <label for="trek_id" class="form-label fw-bold">Select Open Trek *</label>
              <select name="trek_id" id="trek_id" class="form-select" required>
                <option value="">-- Choose an open trek --</option>
                {% for t in treks %}
                  <option value="{{ t.id }}">{{ t.name }} (Available slots: {{ t.available_slots }})</option>
                {% endfor %}
              </select>
            </div>

            <h5 class="fw-bold mt-4 mb-3">Customer Information</h5>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="customer_name" class="form-label">Full Name *</label>
                <input type="text" name="customer_name" id="customer_name" class="form-control" required placeholder="Trekker Name">
              </div>
              <div class="col-md-6">
                <label for="customer_email" class="form-label">Email Address *</label>
                <input type="email" name="customer_email" id="customer_email" class="form-control" required placeholder="trekker@example.com">
              </div>
              <div class="col-md-4">
                <label for="mobile_country_code" class="form-label">Country Code *</label>
                <input type="text" name="mobile_country_code" id="mobile_country_code" class="form-control" value="+91" required>
              </div>
              <div class="col-md-8">
                <label for="mobile_number" class="form-label">Mobile Number *</label>
                <input type="text" name="mobile_number" id="mobile_number" class="form-control" required placeholder="9876543210">
              </div>
            </div>

            <h5 class="fw-bold mt-4 mb-3">Participants</h5>
            <div id="participants-container">
              <div class="row g-2 mb-2 participant-row">
                <div class="col-md-8">
                  <input type="text" name="participant_name" class="form-control" required placeholder="Participant #1 Name">
                </div>
                <div class="col-md-4">
                  <input type="number" name="participant_age" class="form-control" placeholder="Age (optional)" min="0" max="120">
                </div>
              </div>
            </div>
            <button type="button" class="btn btn-sm btn-outline-primary mb-3" id="add-participant-btn">+ Add Another Participant</button>

            <h5 class="fw-bold mt-3 mb-3">Payment & Notes</h5>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="stated_amount" class="form-label">Stated Offline Amount (₹) *</label>
                <input type="number" step="0.01" name="stated_amount" id="stated_amount" class="form-control" required placeholder="e.g. 5000.00">
                <div class="form-text">Amount collected offline (cash, NEFT, direct UPI).</div>
              </div>
              <div class="col-md-12">
                <label for="note" class="form-label">Staff Note / Reference (Optional)</label>
                <textarea name="note" id="note" class="form-control" rows="2" placeholder="e.g. Cash collected in office / Cheque #12345"></textarea>
              </div>
            </div>

            <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
              <a href="{{ url_for('staff.dashboard') }}" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary px-4">Submit for Sign-off</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('add-participant-btn').addEventListener('click', function() {
  const container = document.getElementById('participants-container');
  const count = container.querySelectorAll('.participant-row').length + 1;
  const div = document.createElement('div');
  div.className = 'row g-2 mb-2 participant-row';
  div.innerHTML = `
    <div class="col-md-8">
      <input type="text" name="participant_name" class="form-control" required placeholder="Participant #${count} Name">
    </div>
    <div class="col-md-4">
      <input type="number" name="participant_age" class="form-control" placeholder="Age (optional)" min="0" max="120">
    </div>
  `;
  container.appendChild(div);
});
</script>
{% endblock %}
