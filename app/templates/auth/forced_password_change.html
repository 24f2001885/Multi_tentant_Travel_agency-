
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password — TMA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body>
<div class="d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-sm" style="width: 400px; max-width: 100%;">
    <div class="card-body p-4">
      <h1 class="h5 mb-4 text-center">Set a new password to continue</h1>
      <form method="POST" action="{{ url_for('auth.forced_password_change') }}">
        {{ form.hidden_tag() }}
        <div class="mb-3">
          {{ form.new_password.label(class="form-label") }}
          {{ form.new_password(class="form-control") }}
        </div>
        <div class="mb-3">
          {{ form.confirm_password.label(class="form-label") }}
          {{ form.confirm_password(class="form-control") }}
        </div>
        <button type="submit" class="btn btn-primary w-100">Set Password</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
