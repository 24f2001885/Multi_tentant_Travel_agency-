
{% extends "shared/base.html" %}
{% block shell %}{% include "shared/sidebar_admin.html" %}{% endblock %}
{% block content %}
<div class="mx-auto bg-white border rounded-3 p-4" style="max-width:480px;border-color:#E2E4E9;">
  <h1 class="h4 mb-4" style="font-family:'Bitter',serif;font-weight:700;">Profile</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" name="name" class="form-control" value="{{ current_user.name }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="text" class="form-control" value="{{ current_user.email }}" disabled readonly>
    </div>
    <hr>
    <h2 class="h6 text-uppercase" style="color:#6B7280;">Change Password</h2>
    <div class="mb-3"><label class="form-label">Current Password</label><input type="password" name="current_password" class="form-control"></div>
    <div class="mb-3"><label class="form-label">New Password</label><input type="password" name="new_password" class="form-control"></div>
    <div class="mb-3"><label class="form-label">Confirm New Password</label><input type="password" name="confirm_password" class="form-control"></div>
    <button type="submit" class="btn w-100" style="background:#1F4FD8;color:#fff;">Save Changes</button>
  </form>
</div>
{% endblock %}
