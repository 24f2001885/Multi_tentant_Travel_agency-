name: Deploy TMA to AWS EC2

on:
  push:
    branches:
      - main
      - master
      - phase/production-deployment
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Debug Environment and Secrets Preflight
        run: |
          echo "=== Preflight Secret & Variable Check ==="
          [ -n "${{ secrets.AWS_HOST }}" ] && echo "::notice::secrets.AWS_HOST is PRESENT" || echo "::warning::secrets.AWS_HOST is MISSING"
          [ -n "${{ secrets.AWS_USER }}" ] && echo "::notice::secrets.AWS_USER is PRESENT" || echo "::warning::secrets.AWS_USER is MISSING"
          [ -n "${{ secrets.AWS_SSH_KEY }}" ] && echo "::notice::secrets.AWS_SSH_KEY is PRESENT" || echo "::warning::secrets.AWS_SSH_KEY is MISSING"
          [ -n "${{ vars.AWS_HOST }}" ] && echo "::notice::vars.AWS_HOST is PRESENT" || true
          [ -n "${{ vars.AWS_USER }}" ] && echo "::notice::vars.AWS_USER is PRESENT" || true
          [ -n "${{ vars.AWS_SSH_KEY }}" ] && echo "::notice::vars.AWS_SSH_KEY is PRESENT" || true

      - name: Deploy to AWS EC2 via SSH
        env:
          SSH_KEY: ${{ secrets.AWS_SSH_KEY || vars.AWS_SSH_KEY || secrets.EC2_SSH_KEY || vars.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.AWS_HOST || vars.AWS_HOST || secrets.EC2_HOST || '3.27.28.167' }}
          USER: ${{ secrets.AWS_USER || vars.AWS_USER || secrets.EC2_USER || 'ubuntu' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH private key secret (AWS_SSH_KEY) is missing or empty."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p 22 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p 22 "$USER@$HOST" << 'EOF'
            set -e
            echo "=== [1/5] Navigating to TMA Project Directory ==="
            if [ ! -d "/home/ubuntu/mad1" ]; then
              git clone https://github.com/24f2001885/Multi_tentant_Travel_agency-.git /home/ubuntu/mad1
            fi
            cd /home/ubuntu/mad1

            echo "=== [2/5] Pulling Latest Changes from GitHub ==="
            git fetch origin
            CURRENT_BRANCH="${{ github.ref_name }}"
            git checkout $CURRENT_BRANCH || git checkout master || git checkout main
            git reset --hard origin/$CURRENT_BRANCH || git reset --hard origin/master

            echo "=== [3/5] Setting up Production Environment & Launching Containers ==="
            if [ ! -f .env.production ]; then
              cp .env.production.example .env.production
            fi
            sed -i 's|BASE_DOMAIN=.*|BASE_DOMAIN=abhishekpathak.site|' .env.production
            sed -i 's|PLATFORM_ADMIN_HOST=.*|PLATFORM_ADMIN_HOST=tma.abhishekpathak.site|' .env.production
            sed -i 's|TENANT_ZERO_SUBDOMAIN=.*|TENANT_ZERO_SUBDOMAIN=tma.tenant0|' .env.production
            sed -i 's|SECRET_KEY=generate_a_64_character_hex_string_here|SECRET_KEY=prod-secret-tma-secure-84c29d10e53|' .env.production
            docker compose -f docker-compose.prod.yml up -d --build

            echo "=== [4/5] Executing Database Migrations ==="
            docker compose -f docker-compose.prod.yml exec -T web flask db upgrade

            echo "=== [5/5] Initializing Live Production Tenants & Seeding Recruiter Demo Data ==="
            docker compose -f docker-compose.prod.yml exec -T web flask init-live-tenants
            docker compose -f docker-compose.prod.yml exec -T web flask seed-recruiter-demo

            echo "=== [Verification] Checking Container Status ==="
            docker compose -f docker-compose.prod.yml ps

            echo "🚀 Deployment to https://tma.abhishekpathak.site completed successfully!"
          EOF
